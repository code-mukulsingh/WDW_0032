<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
 <h1 align="center">Student Registration Form</h1>
 <hr>
 <form action="submit.html" method="post">
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"required>
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter valid email adress" required>
    <br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter password" required>
    <br><br>
    <label for="gender">Gender:</label>
    <input type="radio" id="name" name="gender">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender">
    <label for="other">Other</label>
    <br><br>
    <label for="course">Course:</label>
    <select id="course" name="course" placeholder="Select your course">
        <option value="">-- Select Course --</option>
        <option value="btech">B.Tech</option>
        <option value="bca">BCA</option>
        <option value="bsc">B.Sc</option>
    </select>
    <br><br>
    <label for="contact">Contact No. :</label>
    <input type="tel" id="contact" name="contact" placeholder="Enter phone number" required>
    <br><br>
    <label for="address">Address:</label>
    <br>
    <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your Address"></textarea>
    <br><br>
    <button type="submit">Register</button>
    <button type="reset">Clear</button>
    <hr>
    <p align="center">
        &copy; 2026 Student Registration Portal
    </p>

 </form>  
</body>
</html>
